<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Blast Media | Tools</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{font-family:Lato,Arial,sans-serif;--ink:#1c2925;--muted:#64746c;--green:#6aa83c;--lime:#a5cf3a;--line:#e2e9e3;--bg:#f5f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}button,input{font:inherit}.header{background:white;border-bottom:1px solid var(--line)}.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:center;align-items:center;padding:23px 26px}.brand img{display:block;width:min(560px,85vw);max-height:118px;object-fit:contain}main{max-width:1160px;margin:auto;padding:0 28px 55px}.hero{padding:48px 0 31px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#528b36}.hero h1{font-size:clamp(32px,4vw,47px);line-height:1.12;letter-spacing:-1.6px;margin:12px 0}.hero h1 span{color:#65a339}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:34px 0 18px}.section-title{font-size:19px;font-weight:900}.section-title small{font-size:12px;color:#8a9990;margin-left:8px;font-weight:700}.search{display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff;border:1px solid #dce5de;border-radius:11px;width:265px;max-width:100%}.search:before{content:'⌕';font-size:23px;color:#7e9285}.search input{border:0;outline:0;background:transparent;padding:12px 0;min-width:0;width:100%;font-size:13px}.search:focus-within{outline:2px solid #a5cf3a}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;min-height:270px;display:flex;flex-direction:column;box-shadow:0 5px 20px #1b3b2510;transition:transform .18s,box-shadow .18s,border-color .18s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 32px #1b3b2520;border-color:#a4ca91}.card:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.card-top{display:flex;align-items:center;justify-content:space-between}.card-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#edf6e7;color:#478c35;font-size:25px;font-weight:900}.card:nth-child(2) .card-icon{background:#e9f2f3;color:#357b84}.card:nth-child(3) .card-icon{background:#f2edf9;color:#8060a5}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:900;color:#5d8060;background:#f0f6ed;padding:7px 10px;border-radius:20px}.card h2{font-size:22px;letter-spacing:-.5px;margin:21px 0 9px;font-weight:900}.card p{color:#6c7d74;font-size:13px;line-height:1.7;margin:0 0 22px}.launch{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0ed;padding-top:17px;color:#45862c;font-size:13px;font-weight:900}.launch:after{content:'↗';font-size:20px}.lower{margin-top:28px;background:#edf3ea;border:1px solid #dce8d8;border-radius:14px;padding:21px 25px}.lower h3{margin:0 0 6px;font-size:15px}.lower p{margin:0;font-size:13px;color:#6b7c6d}.footer{margin-top:35px;color:#94a19a;font-size:12px}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #c8d7cf;border-radius:12px}.empty[hidden]{display:none}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:0 18px 36px}.header-inner{padding:20px}.brand img{max-height:90px}.hero{padding:32px 0 25px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.cards{grid-template-columns:1fr}.card{min-height:235px}.hero h1{font-size:35px}}
</style>
</head><body>
<header class="header"><div class="header-inner"><a class="brand" href="./" aria-label="Blast Media Tools home"><img src="blast-media-logo.png" alt="Blast Media"></a></div></header>
<main><section class="hero"><div class="eyebrow">BLAST MEDIA / WORKSPACE</div><h1>Everything you need to <span>get it done.</span></h1><p>Your production tools, all in one place. Choose a tool to get started.</p></section>
<section aria-labelledby="tools-title"><div class="toolbar"><div id="tools-title" class="section-title">Your tools <small id="count"></small></div><label class="search"><input id="search-input" type="search" placeholder="Search tools..." aria-label="Search tools"></label></div><div class="cards" id="cards"></div><div class="empty" id="empty" hidden>No tools match your search.</div></section>
<section class="lower"><h3>More tools on the way</h3><p>Add new projects to the dashboard whenever they're ready.</p></section><footer class="footer">© <span id="year"></span> Blast Media · Tools Dashboard</footer></main>
<script>
// ADD FUTURE PROJECTS HERE: duplicate an entry and update its name, description, and URL.
const PROJECTS = [
 {name:'Rinkboard Builder',description:'Create rinkboard layouts, manage artwork, and export print-ready proofs and production files.',url:'https://blastmediainc.github.io/rinkboards/',category:'Production'},
 {name:'Quoting Calculator',description:'Build estimates and calculate pricing for print and production projects.',url:'https://blastmediainc.github.io/quotingcalculator/',category:'Estimating'},
 {name:'Proof Builder',description:'Create production mockups from uploaded artwork with editable quantities, materials, instructions, shipping details, and deadlines.',url:'https://blastmediainc.github.io/proofbuilder/',category:'Production'}
];
const cards=document.getElementById('cards'),search=document.getElementById('search-input'),empty=document.getElementById('empty'),count=document.getElementById('count');
function render(){const q=search.value.trim().toLowerCase();const visible=PROJECTS.filter(p=>(p.name+' '+p.description+' '+p.category).toLowerCase().includes(q));cards.replaceChildren();for(const p of visible){const a=document.createElement('a');a.className='card';a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';const top=document.createElement('div');top.className='card-top';const ico=document.createElement('div');ico.className='card-icon';ico.textContent=p.name==='Rinkboard Builder'?'▤':p.name==='Quoting Calculator'?'＄':'▧';const tag=document.createElement('span');tag.className='tag';tag.textContent=p.category;top.append(ico,tag);const h=document.createElement('h2');h.textContent=p.name;const d=document.createElement('p');d.textContent=p.description;const go=document.createElement('div');go.className='launch';go.textContent='Open tool';a.append(top,h,d,go);cards.append(a)}count.textContent=`${visible.length} ${visible.length===1?'tool':'tools'}`;empty.hidden=visible.length!==0}
search.addEventListener('input',render);document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
